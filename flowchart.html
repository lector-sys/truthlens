<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLens build flowchart</title>
<style>
  :root { --fg: #1c1917; --bg: #fafaf9; --muted: #57534e; --acc: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e7e5e4; --bg: #1c1917; --muted: #a8a29e; --acc: #fb923c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1140px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 40px 0 8px; }
  p.lede { color: var(--muted); margin: 0 0 20px; }
  figure { margin: 0; }
  figcaption { color: var(--muted); font-size: 14px; margin-top: 8px; }
  svg { width: 100%; height: auto; display: block; color: var(--fg); }
  svg text { fill: currentColor; font: 12px system-ui, sans-serif; }
  svg .b { font-weight: 600; font-size: 13px; }
  svg .s { font-size: 11px; fill: var(--muted); }
  svg .acc { stroke: var(--acc); }
  svg .accf { fill: var(--acc); }
  svg text.acct { fill: var(--acc); }
  svg .box { fill: none; stroke: currentColor; stroke-width: 1.3; }
  svg .ln { stroke: currentColor; stroke-width: 1.3; fill: none; }
  svg .dash { stroke-dasharray: 5 4; }
  svg .grid { stroke: currentColor; stroke-opacity: .18; }
  svg .bar { fill: currentColor; fill-opacity: .07; stroke: currentColor; stroke-opacity: .5; }
</style>
</head>
<body>
<main>
<h1>TruthLens: build flowchart</h1>
<p class="lede">Path from upload to report, matching the scaffold in <code>C:\Users\meyaa\truthlens</code>. ✓ = working in the scaffold now, ○ = still to build.</p>

<figure>
<svg viewBox="0 0 1100 1060" role="img" aria-label="Flow: evidence and context are uploaded, hashed into the vault, routed to image, video, audio and text analyzers, merged into an Indicator list, cross-checked across modalities, fused into a label, and shown in the review UI and HTML report. Luna and whisper-1 are called for text claims, caption checks and transcripts; every step is written to the case log.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accf" d="M0,0L10,5L0,10z"/></marker>
  </defs>

  <!-- legend -->
  <text x="870" y="30" class="s">✓ working now   ○ to build</text>
  <line x1="870" y1="46" x2="905" y2="46" class="ln acc" marker-end="url(#o)"/><text x="912" y="50" class="s">OpenAI API call</text>
  <line x1="870" y1="64" x2="905" y2="64" class="ln dash" marker-end="url(#a)"/><text x="912" y="68" class="s">logging / side data</text>

  <!-- inputs -->
  <rect x="300" y="20" width="220" height="50" rx="6" class="box"/>
  <text x="410" y="41" text-anchor="middle" class="b">Evidence files</text>
  <text x="410" y="59" text-anchor="middle" class="s">image · video · audio</text>
  <rect x="580" y="20" width="220" height="50" rx="6" class="box"/>
  <text x="690" y="41" text-anchor="middle" class="b">Context text</text>
  <text x="690" y="59" text-anchor="middle" class="s">caption · claimed date/place · quotes</text>
  <line x1="410" y1="70" x2="460" y2="110" class="ln" marker-end="url(#a)"/>
  <line x1="690" y1="70" x2="640" y2="110" class="ln" marker-end="url(#a)"/>

  <!-- app / vault / pipeline -->
  <rect x="380" y="110" width="340" height="44" rx="6" class="box"/>
  <text x="550" y="137" text-anchor="middle" class="b">app.py · Streamlit upload</text>
  <line x1="550" y1="154" x2="550" y2="190" class="ln" marker-end="url(#a)"/>

  <rect x="380" y="190" width="340" height="60" rx="6" class="box"/>
  <text x="550" y="214" text-anchor="middle" class="b">vault.py · Evidence vault</text>

  <rect x="380" y="290" width="340" height="44" rx="6" class="box"/>

  <line x1="415" y1="357" x2="415" y2="380" class="ln" marker-end="url(#a)"/>
  <line x1="685" y1="357" x2="685" y2="380" class="ln" marker-end="url(#a)"/>
  <line x1="955" y1="357" x2="955" y2="380" class="ln" marker-end="url(#a)"/>
  <text x="151" y="374" class="s">.jpg .png .webp</text>
  <text x="421" y="374" class="s">.mp4 .mov .mkv</text>
  <text x="691" y="374" class="s">.wav .mp3 .m4a</text>
  <text x="961" y="374" class="s">context text</text>

  <text x="44" y="464">✓ ELA heatmap + region box</text>
  <text x="44" y="482">○ noise-level map</text>
  <text x="44" y="500">○ copy-move (ORB keypoints)</text>

  <text x="415" y="420" text-anchor="middle" class="s">Owner A · CPU</text>
  <text x="314" y="446">✓ ffprobe metadata</text>

  <line x1="145" y1="530" x2="145" y2="555" class="ln"/>
  <line x1="415" y1="530" x2="415" y2="555" class="ln"/>
  <line x1="685" y1="530" x2="685" y2="555" class="ln"/>

  <text x="558" y="573" class="s">each returns list[Indicator]</text>

  <rect x="380" y="580" width="340" height="54" rx="6" class="box"/>

  <text x="550" y="622" text-anchor="middle" class="s">location · score · reliability · why · alternatives</text>

  <text x="1036" y="600" class="s">claims</text>
  <line x1="780" y1="530" x2="880" y2="660" class="ln acc" marker-end="url(#o)"/>
  <text x="838" y="625" text-anchor="end" class="s">audio file</text>

  <text x="815" y="732" text-anchor="middle" class="s">caption+image</text>

  <!-- case log -->
  <rect x="30" y="670" width="230" height="70" rx="6" class="box"/>
  <text x="145" y="694" text-anchor="middle" class="b">cases/&lt;id&gt;/log.jsonl</text>
  <text x="145" y="714" text-anchor="middle" class="s">append-only: every step, tool, error</text>

</svg>
<figcaption>Runtime flow. Forensic signals stay on CPU; Luna only handles meaning (claims, caption ↔ image) and is never asked whether media is fake. With no API key the orange calls are skipped and the rest still runs.</figcaption>
</figure>

<h2>24-hour build plan</h2>
