[theme]
base = "dark"
primaryColor = "#4FD1C5"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#151B23"
textColor = "#E6EDF3"
borderColor = "#263040"
font = "Inter, 'Segoe UI', system-ui, sans-serif"
headingFont = "'Space Grotesk', Inter, 'Segoe UI', sans-serif"
codeFont = "'JetBrains Mono', Consolas, ui-monospace, monospace"
baseRadius = "10px"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk.woff2"
weight = "300 700"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono.woff2"
weight = "100 800"

[server]
enableStaticServing = true
maxUploadSize = 50  # MB; public-mode limit (demo.py passes 200 locally, as before)
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
